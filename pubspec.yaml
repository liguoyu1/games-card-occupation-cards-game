name: occupation_cards
description: "职业卡牌 - 现实职业卡牌对战游戏，对标炉石传说"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # 游戏引擎
  flame: ^1.21.0
  flame_audio: ^2.10.2

  # 导航
  go_router: ^14.6.2

  # 状态管理
  provider: ^6.1.2

  # 本地存储
  shared_preferences: ^2.3.4

  # 字体
  google_fonts: ^6.2.1

  # 图标
  cupertino_icons: ^1.0.8
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/
